[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devpilot"
version = "0.1.0"
description = "An autonomous software engineering agent that plans, codes, tests in Docker and opens pull requests."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sai Pavan" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14",
    "google-genai>=2.31",
    "docker>=7.1",
    "PyGithub>=2.5",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
devpilot = "devpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]
